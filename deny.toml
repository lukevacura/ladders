# Dependency policy, checked by `cargo deny check advisories licenses`.

[advisories]
# Fail on any known vulnerability, unmaintained crate, or unsound finding in the
# dependency tree; the RustSec default for an unconfigured section already denies these,
# listed explicitly so a future relaxation is a visible diff.
yanked = "deny"

[licenses]
# The common permissive set covering every license in the current tree (direct and
# transitive, including dev-dependencies): MIT, Apache-2.0 (plain and the LLVM exception
# variant used by some arch-detection crates), BSD-2-Clause, and Unicode-3.0 (the
# `unicode-ident` data tables). A dependency's SPDX expression only needs one allowed
# term per `OR`, so this set also covers crates that additionally offer a
# copyleft-licensed choice (e.g. `MIT OR Apache-2.0 OR LGPL-2.1-or-later`) without
# allowing that choice itself.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
# Neither workspace crate is published yet, and which license to release under is still an
# open decision for the project owner, so neither declares a `license`. `publish = false` on
# both (crates/testkit already had it; crates/core gains it here) makes that current, factual
# state checkable instead of asserting a license ahead of that decision.
ignore = true
